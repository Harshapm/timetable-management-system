<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="fragments/header :: head"></head>
  <body>
    <div th:replace="fragments/header :: nav"></div>

    <div class="container page-shell">
      <div class="card z-depth-1 page-card">
        <div class="card-content">
          <div class="page-header">
            <div class="page-title-group">
              <h4 class="blue-text text-darken-2">Add / Edit Teacher</h4>
              <p class="grey-text text-darken-1">Keep teacher details consistent and easy to review.</p>
            </div>
          </div>
          <form th:action="@{/teachers}" th:object="${teacher}" method="post" class="page-form section">
            <div class="row">
              <div class="input-field col s12 m6">
                <input id="name" type="text" class="validate" th:field="*{name}" required />
                <label for="name">Name</label>
              </div>

              <div class="input-field col s12 m6">
                <input id="email" type="email" class="validate" th:field="*{email}" required />
                <label for="email">Email</label>
              </div>
            </div>

            <div class="row">
              <div class="input-field col s12">
                <input id="department" type="text" class="validate" th:field="*{department}" required />
                <label for="department">Department</label>
              </div>
            </div>

            <div class="form-actions">
              <a th:href="@{/teachers}" class="btn-flat">Back to List</a>
              <button type="submit" class="btn waves-effect waves-light blue">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
  </body>
</html>
