<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="fragments/header :: head"></head>
  <body>
    <div th:replace="fragments/header :: nav"></div>

    <div class="container page-shell">
      <div class="card z-depth-1 page-card">
        <div class="card-content">
          <div class="page-header">
            <div class="page-title-group">
              <h4 class="blue-text text-darken-2">Add / Edit Time Slot</h4>
              <p class="grey-text text-darken-1">Define periods with consistent and readable time details.</p>
            </div>
          </div>
          <form th:action="@{/time-slots}" th:object="${timeSlot}" method="post" class="page-form section">
            <div class="row">
              <div class="input-field col s12 m6">
                <input id="dayOfWeek" type="text" class="validate" th:field="*{dayOfWeek}" placeholder="e.g., MONDAY" required />
                <label for="dayOfWeek">Day of Week</label>
              </div>

              <div class="input-field col s12 m6">
                <input id="periodNumber" type="number" class="validate" th:field="*{periodNumber}" placeholder="e.g., 1" required />
                <label for="periodNumber">Period Number</label>
              </div>
            </div>

            <div class="row">
              <div class="input-field col s12 m6">
                <input id="startTime" type="text" class="validate" th:field="*{startTime}" placeholder="e.g., 09:00" required />
                <label for="startTime">Start Time</label>
              </div>

              <div class="input-field col s12 m6">
                <input id="endTime" type="text" class="validate" th:field="*{endTime}" placeholder="e.g., 09:50" required />
                <label for="endTime">End Time</label>
              </div>
            </div>

            <div class="form-actions">
              <a th:href="@{/time-slots}" class="btn-flat">Back to List</a>
              <button type="submit" class="btn waves-effect waves-light blue">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
  </body>
</html>
