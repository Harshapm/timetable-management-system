<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="fragments/header :: head"></head>
  <body>
    <div th:replace="fragments/header :: nav"></div>

    <div class="container page-shell">
      <div class="card z-depth-1 page-card">
        <div class="card-content">
          <div class="page-header">
            <div class="page-title-group">
              <h4 class="blue-text text-darken-2">Time Slots</h4>
              <p class="grey-text text-darken-1">Plan daily periods and class timing blocks consistently.</p>
            </div>
            <div class="page-actions">
              <a th:href="@{/time-slots/new}" class="btn waves-effect waves-light blue"><i class="material-icons left">schedule</i>Add Slot</a>
              <a th:href="@{/}" class="btn-flat">Home</a>
            </div>
          </div>

          <div class="section">
            <div class="table-wrapper">
              <table class="highlight responsive-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Day</th>
                  <th>Period</th>
                  <th>Start Time</th>
                  <th>End Time</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="ts : ${timeSlots}">
                  <td th:text="${ts.id}"></td>
                  <td th:text="${ts.dayOfWeek}"></td>
                  <td th:text="${ts.periodNumber}"></td>
                  <td th:text="${ts.startTime}"></td>
                  <td th:text="${ts.endTime}"></td>
                </tr>
              </tbody>
            </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
  </body>
</html>
