<head th:fragment="head">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle}">Timetable System</title>

  <!-- Google Font + Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"/>

  <style>
    body{font-family:'Poppins',sans-serif;background:linear-gradient(180deg,#f8fbff 0%,#f3f7ff 100%);margin:0;color:#0f172a;min-height:100vh}
    .card{border-radius:16px;box-shadow:0 10px 25px rgba(15,23,42,0.08)}
    .brand-logo{font-weight:600;display:flex;align-items:center;gap:8px}
    .material-actions .btn{border-radius:8px}
    .container{max-width:1120px}

    .page-shell{padding:28px 0 40px}
    .page-card{border-radius:18px;box-shadow:0 16px 40px rgba(15,23,42,0.08);overflow:hidden}
    .page-card .card-content{padding:28px 28px 24px}
    .page-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .page-title-group h4,.page-title-group h3{margin:0;font-weight:600}
    .page-title-group p{margin:4px 0 0;color:#64748b}
    .page-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .page-actions .btn,.page-actions .btn-flat{margin:0;border-radius:999px}
    .page-actions .btn{padding:0 16px}
    .page-section{margin-top:18px}
    .tool-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
    .tool-actions form{display:inline-flex}
    .table-wrapper{width:100%;overflow-x:auto;border:1px solid #e2e8f0;border-radius:14px}
    table.highlight{margin:0}
    table.highlight thead{background:#f8fafc}
    table.highlight th,table.highlight td{padding:14px 16px;vertical-align:middle}
    table.highlight tbody tr{border-bottom:1px solid #f1f5f9}
    table.highlight tbody tr:last-child{border-bottom:none}
    .page-form{display:grid;gap:14px}
    .form-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:16px}
    .hero-panel{padding:8px 0 20px}
    .hero-panel h3{margin:0 0 8px;font-weight:600}

    /* Modern Gradient Colors (used by cards on the dashboard) */
    .bg-gradient-primary { background: linear-gradient(45deg, #4e73df, #224abe); color: white; }
    .bg-gradient-success { background: linear-gradient(45deg, #1cc88a, #13855c); color: white; }
    .bg-gradient-info { background: linear-gradient(45deg, #36b9cc, #258391); color: white; }
    .bg-gradient-warning { background: linear-gradient(45deg, #f6c23e, #dda20a); color: white; }
    .bg-gradient-dark { background: linear-gradient(45deg, #343a40, #212529); color: white; }

    .dashboard-card { height: 100%; display: flex; flex-direction: column; }
    .dashboard-card .card-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 26px 20px 18px;
      min-height: 220px;
    }
    .dashboard-card .card-content i.material-icons { font-size: 2.3rem; margin-bottom: 8px; }
    .dashboard-card .card-content h5 { margin: 0 0 8px; font-size: 1.15rem; font-weight: 600; }
    .dashboard-card .card-content h3 { margin: 0; font-size: 2.1rem; font-weight: 700; }
    .dashboard-card .card-action { padding: 0 20px 20px; }
    .dashboard-card .dashboard-card-btn {
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      box-shadow: none;
      font-weight: 600;
    }
  </style>
</head>

<div th:fragment="nav">
  <nav class="white z-depth-1">
    <div class="container">
      <div class="nav-wrapper">
        <a th:href="@{/}" class="brand-logo black-text"><i class="material-icons left" style="vertical-align:middle">calendar_today</i>CHRONOS</a>
        <ul id="nav-mobile" class="right">
          <li><a th:href="@{/}" class="black-text">Dashboard</a></li>
        </ul>
      </div>
    </div>
  </nav>
</div>
